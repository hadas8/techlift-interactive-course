<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>תרגילים אינטראקטיביים</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      direction: rtl;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(29,158,117,0.18), transparent 34rem),
        radial-gradient(circle at bottom left, rgba(55,138,221,0.16), transparent 34rem),
        #f7f4ec;
      color: #1f2933;
    }
    main { max-width: 960px; margin: 0 auto; padding: 58px 24px; }
    .hero, .card {
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(30,41,59,0.12);
      border-radius: 26px;
      box-shadow: 0 18px 48px rgba(30,41,59,0.09);
    }
    .hero { padding: 34px; margin-bottom: 22px; }
    h1 { margin: 0 0 12px; font-size: clamp(32px, 5vw, 48px); letter-spacing: -0.04em; }
    p { margin: 0; color: #5b6470; line-height: 1.7; font-size: 18px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
    .card {
      display: block;
      padding: 24px;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 24px 58px rgba(30,41,59,0.12); }
    .tag {
      display: inline-block;
      background: #e1f5ee;
      color: #0f6e56;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h2 { margin: 0 0 8px; font-size: 24px; }
    .small { font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>תרגילים אינטראקטיביים</h1>
      <p>מרכז התרגילים של סדנת היזמות וה־Vibe Coding. בחרו פעילות והמשיכו לפי הנחיות המדריך.</p>
    </section>

    <section class="grid">
      <a class="card" href="./exercises/mvp-v2/">
        <span class="tag">MVP</span>
        <h2>חדר הבריחה של ה־MVP</h2>
        <p class="small">אתגר מיון, התאמה ומשימת צוות לבחירת גרסת MVP.</p>
      </a>

      <a class="card" href="./exercises/mvp-v2/editor.html">
        <span class="tag">צוות פדגוגי</span>
        <h2>עריכת פעילות MVP</h2>
        <p class="small">פתיחת ממשק העריכה והורדת config.json מעודכן.</p>
      </a>
    </section>
  </main>
</body>
</html>
